name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
          cache: pip
      - run: python -m pip install --only-binary=:all: -r requirements.txt
      - name: Install a virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Test with Tk on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python run.py test
      - name: Test on Windows
        if: runner.os == 'Windows'
        run: python run.py test
      - run: python tools/build_reference.py --check
      - run: python tools/check_repository.py
      - run: python run.py --config configs/study_01_decay.json --check
      - run: python run.py --config configs/study_01_decay.json
      - run: python tools/check_first_test.py
      - run: python tools/check_dark_helium.py
